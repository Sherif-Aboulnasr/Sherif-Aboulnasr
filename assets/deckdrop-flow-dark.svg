<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 194" width="960" height="194" role="img" aria-labelledby="t d" fill="none"><title id="t">From source material to a post-ready deck</title><desc id="d">Topic, URL, or PDF (source material and brand voice), then Generate a draft (slide copy and background images), then Edit the details (text, layers, layout, and style), then Render &amp; export (platform-sized slides in a ZIP).</desc><style>@font-face{font-family:Inter;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Inter;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Inter;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-kerning:normal;font-feature-settings:'kern','calt','cv11'}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x="0.5" y="0.5" width="959" height="193" fill="#151b23" rx="16" stroke="#262d36" stroke-width="1"/><text x="30" y="52" font-size="19" font-weight="500" fill="#9aa3ad">From source material to a post-ready deck</text><text x="30" y="102" font-size="20" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">Topic, URL, or PDF</text><text x="30" y="134" font-size="18" font-weight="400" fill="#9aa3ad">Source material and</text><text x="30" y="160" font-size="18" font-weight="400" fill="#9aa3ad">brand voice</text><text x="266" y="102" font-size="20" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">Generate a draft</text><text x="266" y="134" font-size="18" font-weight="400" fill="#9aa3ad">Slide copy and</text><text x="266" y="160" font-size="18" font-weight="400" fill="#9aa3ad">background images</text><g transform="translate(237 86) scale(0.75)" fill="none" stroke="#768390" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round" color="#768390" ><path d="M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5"/></g><text x="502" y="102" font-size="20" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">Edit the details</text><text x="502" y="134" font-size="18" font-weight="400" fill="#9aa3ad">Text, layers, layout,</text><text x="502" y="160" font-size="18" font-weight="400" fill="#9aa3ad">and style</text><g transform="translate(473 86) scale(0.75)" fill="none" stroke="#768390" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round" color="#768390" ><path d="M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5"/></g><text x="738" y="102" font-size="20" font-weight="600" fill="#f0f6fc" letter-spacing="-0.2">Render &amp; export</text><text x="738" y="134" font-size="18" font-weight="400" fill="#9aa3ad">Platform-sized slides</text><text x="738" y="160" font-size="18" font-weight="400" fill="#9aa3ad">in a ZIP</text><g transform="translate(709 86) scale(0.75)" fill="none" stroke="#768390" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round" color="#768390" ><path d="M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5"/></g></svg>